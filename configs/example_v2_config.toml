# Offline anomaly models
[[anomaly-models]]
type = "svm"
name = "svm"

[anomaly-models.hyperparameters]
safe = [
    {mean = 0.0, std_dev = 10.0, num = 70}
]
unsafe = [
    {mean = 60.0, std_dev = 10.0, num = 15},
    {mean = -60.0, std_dev = 10.0, num = 15},
]

[[anomaly-models]]
type = "isolation-forest"
name = "isolation forest"

[anomaly-models.hyperparameters]
